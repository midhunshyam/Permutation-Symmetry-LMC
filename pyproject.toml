[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lmc"
version = "1.0.0"
description = "Two studies of linear mode connectivity and parameter symmetry in small MLPs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Midhun Shyam" }]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
include = ["lmc*"]
